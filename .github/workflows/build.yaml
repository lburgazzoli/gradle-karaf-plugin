name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/master' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Java 8 runs the Gradle 8.0.2 integration test; 17, installed last, is JAVA_HOME for the rest.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: |
            8
            17
      # Puts Gradle 8.0.2, the oldest version the plugin supports, on PATH as gradle; ./gradlew runs the wrapper's version.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0.2"
      - name: Test
        run: |
          ./gradlew check jar javadoc publishToMavenLocal
      # CI has no signing key, so this fails if a release version starts requiring a signature locally.
      - name: Publish a release version to Maven Local without a signing key
        run: |
          ./gradlew publishToMavenLocal -Pversion=0.0.0-ci
      - name: Integration test (Gradle wrapper)
        run: |
          cd integrationTest && ./gradlew verifyKaraf
      - name: Integration test (Gradle 8.0.2 on Java 8)
        run: |
          cd integrationTest && JAVA_HOME="$JAVA_HOME_8_X64" gradle verifyKaraf
